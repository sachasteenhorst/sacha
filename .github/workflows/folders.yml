# Aanbiedingskeuken: haalt elke week de supermarktfolders op en zet ze live.
# De app zelf staat op de branch claude/intelligent-wozniak-1j5v2q (GitHub Pages);
# dit bestand staat op de hoofdbranch omdat GitHub geplande taken alleen daarvandaan start.
name: Folders ophalen

on:
  schedule:
    - cron: '17 4 * * 1'   # maandag 04:17 UTC (6:17 's zomers, 5:17 's winters)
    - cron: '17 4 * * 4'   # donderdag, voor acties die halverwege de week wisselen
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: folders
  cancel-in-progress: false

jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_BRANCH: claude/intelligent-wozniak-1j5v2q
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Folders ophalen
        run: python3 recepten-app/folders/ophalen.py

      - name: Opslaan en live zetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recepten-app/aanbiedingen.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "Aanbiedingskeuken: folders van $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -q origin "$APP_BRANCH" && git push -q origin "HEAD:$APP_BRANCH" && break; sleep 10; done
          # Een push met GITHUB_TOKEN start de Pages-build niet vanzelf; vraag hem daarom los aan
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages-build aanvragen lukte niet; volgende push zet het live"
