<!doctype html>
<html lang="nl">
<head>

<title>Aanbiedingskeuken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --bg: #FBF7F1;
    --surface: #FFFFFF;
    --ink: #2B2420;
    --muted: #6B5F57;
    --line: #EDE3D8;
    --green: #B84A2A;
    --green-soft: #FBE8DE;
    --olive: #4F6B2F;
    --olive-soft: #EDF2E1;
    --radius: 20px;
    --tag: #F6C31B;
    --tag-ink: #2A2000;
    --baby: #3F61A6;
    --baby-bg: #E9EFFA;
    --warn: #A94F17;
    --warn-bg: #FBEBDD;
    --no: #9B2F2F;
    --no-bg: #F8E4E2;
    --shadow: 0 1px 2px rgba(70, 40, 20, .05), 0 12px 32px -14px rgba(70, 40, 20, .22);
    --glass: rgba(251, 247, 241, .88);
    --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #16110F; --surface: #211A17; --ink: #F4EDE7; --muted: #B5A89E; --line: #3A2F29;
      --green: #F2916B; --green-soft: #3B2219; --olive: #B5CF8E; --olive-soft: #26301B; --tag: #EDBB12; --tag-ink: #231B00;
      --baby: #97B2EA; --baby-bg: #1A2437; --warn: #F0A472; --warn-bg: #36251A;
      --no: #F09A93; --no-bg: #3A1E1D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.7);
      --glass: rgba(22, 17, 15, .86);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #16110F; --surface: #211A17; --ink: #F4EDE7; --muted: #B5A89E; --line: #3A2F29;
    --green: #F2916B; --green-soft: #3B2219; --olive: #B5CF8E; --olive-soft: #26301B; --tag: #EDBB12; --tag-ink: #231B00;
    --baby: #97B2EA; --baby-bg: #1A2437; --warn: #F0A472; --warn-bg: #36251A;
    --no: #F09A93; --no-bg: #3A1E1D; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -14px rgba(0,0,0,.7);
    --glass: rgba(22, 17, 15, .86);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5;
    padding-inline: 16px; padding-block: 0 calc(88px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
  a { color: var(--green); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--baby); outline-offset: 2px; }

  header.top { padding-block: 20px 8px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; }
  .brand span { color: var(--green); }
  .date { color: var(--muted); font-size: 14px; }

  .view { display: flex; flex-direction: column; gap: 16px; padding-block: 8px 24px; }
  .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
  .hero h2 { font-size: clamp(26px, 6.4vw, 36px); font-weight: 800; letter-spacing: -.02em; margin-top: 6px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 14px; margin-top: 8px; }
  .hits { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }

  .tag {
    display: inline-block; background: var(--tag); color: var(--tag-ink); font-weight: 700;
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em; padding: 3px 8px 2px;
    border-radius: 3px; transform: rotate(-2deg); white-space: nowrap;
  }
  .tag.big { font-size: 12px; padding: 4px 10px 3px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .pill.no { background: var(--no-bg); color: var(--no); }
  .pill.baby { background: var(--baby-bg); color: var(--baby); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.ok { background: var(--green-soft); color: var(--green); }

  .section-title { font-family: var(--display); font-size: 18px; font-weight: 700; margin-top: 20px; margin-bottom: 8px; }
  ul.ingr { list-style: none; padding: 0; margin: 0; display: grid; gap: 0; }
  ul.ingr li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  ul.ingr li:last-child { border-bottom: 0; }
  .qty { font-variant-numeric: tabular-nums; flex: none; min-width: 64px; color: var(--muted); font-size: 15px; }
  .iname { flex: 1 1 0; min-width: 0; }
  ol.steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
  ol.steps li::marker { font-family: var(--display); font-weight: 700; color: var(--green); }

  .babybox { background: var(--baby-bg); border-radius: 12px; padding: 16px 18px; margin-top: 20px; }
  .babybox h3 { color: var(--baby); font-size: 18px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .babybox ol.steps li::marker { color: var(--baby); }
  .babybox .note { font-size: 14px; margin: 10px 0 0; }
  .babybox .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .warnline { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 8px 12px; font-size: 14px; margin-top: 10px; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  .btn {
    border: 1px solid var(--line); background: var(--surface); padding: 9px 16px; border-radius: 999px;
    cursor: pointer; font-weight: 700; font-size: 14px;
  }
  .btn:hover { border-color: var(--green); }
  .btn.primary { background: var(--green); color: var(--bg); border-color: var(--green); }

  .snack { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
  .snack h3 { font-size: 18px; }
  .snack p { margin: 0; grid-column: 1 / -1; font-size: 15px; color: var(--muted); }

  .marks { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 40%; }
  .marks:empty { display: none; }
  .marks .pill { white-space: normal; text-align: right; }
  .storebar-wrap { display: flex; flex-direction: column; gap: 6px; padding-block: 4px 12px; }
  .storebar { display: flex; flex-wrap: wrap; gap: 6px; }
  .schip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-size: 14px; cursor: pointer; color: var(--muted); }
  .schip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--bg); }
  button.tag { border: 0; cursor: pointer; font-family: inherit; }
  .price { border: 1px solid var(--tag); background: color-mix(in srgb, var(--tag) 18%, var(--surface)); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .price b, .obest b { font-weight: 700; }
  .more { color: var(--muted); font-size: 12px; }
  .list { padding-block: 8px; }
  .group { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; padding: 14px 0 4px; }
  .orow { width: 100%; display: grid; grid-template-columns: 1fr auto 16px; gap: 10px; align-items: center; text-align: left; background: none; border: 0; border-top: 1px dashed var(--line); padding: 11px 0; cursor: pointer; font-size: 16px; }
  .group + .orow { border-top: 0; }
  .orow:hover .oname { color: var(--green); }
  .obest { font-size: 14px; text-align: right; display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; }
  .chev { color: var(--muted); font-size: 20px; line-height: 1; }
  details.manual > summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 17px; }
  .sheet { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 12, .45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-panel { position: relative; background: var(--surface); width: 100%; max-width: 560px; max-height: 85%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
  .sheet-close { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 22px; line-height: 1; cursor: pointer; }
  ul.cmp { list-style: none; margin: 0; padding: 0; }
  ul.cmp li { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  ul.cmp li:first-child { border-top: 0; }
  ul.cmp li.other { opacity: .6; }
  .cprice { font-family: var(--display); font-weight: 800; font-size: 20px; text-align: right; font-variant-numeric: tabular-nums; }
  .ckg { text-align: right; }
  @media (min-width: 600px) { .sheet { align-items: center; } .sheet-panel { border-radius: 18px; } }

  /* Week */
  .day { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .day.today { border-color: var(--green); box-shadow: 0 0 0 1px var(--green); }
  .day > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; }
  .day > summary::-webkit-details-marker { display: none; }
  .dname { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  .day.today .dname { color: var(--green); }
  .rname { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.25; }
  .day .inner { padding: 0 16px 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 460px) {
    .day > summary { grid-template-columns: 1fr auto; }
    .dname { grid-column: 1 / -1; }
  }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-weight: 700; font-size: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  select, input[type="date"], input[type="number"], textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  }
  textarea { width: 100%; min-height: 110px; resize: vertical; }

  /* Offers */
  .banner { background: var(--warn-bg); color: var(--ink); border-radius: 12px; padding: 14px 16px; font-size: 15px; }
  .banner strong { color: var(--warn); }
  .cat { margin-top: 18px; }
  .cat h3 { font-size: 15px; font-family: var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 13px;
    cursor: pointer; font-size: 15px; display: inline-flex; gap: 6px; align-items: center;
  }
  .chip[aria-pressed="true"] { background: var(--tag); color: var(--tag-ink); border-color: var(--tag); font-weight: 700; }
  .chip .grain { font-size: 11px; color: var(--muted); }
  .chip[aria-pressed="true"] .grain { color: var(--tag-ink); }
  .found { font-size: 14px; color: var(--green); margin-top: 8px; min-height: 1.5em; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }

  /* Baby */
  .profile { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; background: var(--baby-bg); color: var(--baby);
    display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 28px;
  }
  .age { font-family: var(--display); font-size: 30px; font-weight: 800; color: var(--baby); line-height: 1; }
  .rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .rules ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; }
  .rules h3 { font-size: 17px; }
  .meter { display: flex; gap: 6px; margin-top: 8px; }
  .meter span { width: 34px; height: 10px; border-radius: 5px; background: var(--line); }
  .meter span.on { background: var(--warn); }
  .disclaimer { font-size: 13px; color: var(--muted); }

  /* Tab bar */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface);
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  }
  nav.tabs .inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; }
  @media (max-width: 440px) { nav.tabs { padding-inline: 2px; } nav.tabs button { font-size: 10.5px; padding-inline: 1px; } nav.tabs button svg { width: 20px; height: 20px; } }

  /* Kosten, budget en boodschappenlijst */
  details.budget { margin-top: 16px; background: var(--bg); border-radius: 10px; padding: 12px 14px; }
  details.budget > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; list-style: none; }
  details.budget > summary::-webkit-details-marker { display: none; }
  details.budget > summary::after { content: "Aanpassen ›"; margin-left: auto; font-size: 13px; font-weight: 700; color: var(--green); }
  details.budget[open] > summary::after { content: "Sluiten"; }
  .bsum { font-family: var(--display); font-weight: 800; font-size: 18px; }
  .over { color: var(--no); } .ok { color: var(--green); }
  ul.costs { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; font-size: 14px; }
  ul.costs li { display: flex; gap: 8px; align-items: baseline; }
  ul.costs li > span:first-child { flex: 1; min-width: 0; }
  .eur, .geur, .leur { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  .eurin input { width: 84px; }
  .swaps { display: grid; gap: 8px; }
  .swaps label { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-items: start; cursor: pointer; font-size: 15px; }
  .swaps label .small { grid-column: 2; }
  .swaps input { width: 18px; height: 18px; accent-color: var(--green); margin-top: 2px; }
  .weekbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
  .bigeur { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .addfree { display: grid; gap: 6px; }
  .addfree input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  .shopgroup .ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .shopgroup h3 { font-size: 20px; }
  .geur { font-size: 16px; }
  ul.shop li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; }
  ul.shop li > input { width: 20px; height: 20px; accent-color: var(--green); }
  .lmain { display: flex; flex-direction: column; min-width: 0; cursor: pointer; }
  .lrow { display: flex; gap: 10px; align-items: baseline; }
  .lsub:empty { display: none; }
  .leur { background: none; border: 0; padding: 4px 2px; font-size: 15px; cursor: pointer; color: var(--ink); }
  button.leur { text-decoration: underline dotted; text-underline-offset: 3px; }
  .lrm { background: none; border: 0; font-size: 20px; color: var(--muted); cursor: pointer; padding: 2px 6px; }
  ul.shop li.done .iname, ul.shop li.done .qty, ul.shop li.done .leur { text-decoration: line-through; opacity: .5; }
  @media (max-width: 380px) { nav.tabs button { font-size: 11px; } }

  /* Recepten en filters */
  .rrow > summary { grid-template-columns: 1fr auto; }
  .rrow .rmeta { grid-column: 1 / -1; margin-top: -4px; }
  .heart { color: var(--no); font-size: 16px; line-height: 1; }
  .btn.fav.on { color: var(--no); border-color: var(--no); }
  details.filters > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font-family: var(--display); font-weight: 700; font-size: 18px; }
  .fgroup { margin-top: 16px; }
  .fgroup h4 { margin: 0 0 6px; font-size: 15px; }
  .prefs { display: grid; gap: 8px; }
  .pref { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .pref > span { min-width: 0; }
  @media (max-width: 370px) { .pref { flex-wrap: wrap; gap: 4px 8px; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--green); color: var(--bg); }
  .seg button[data-pref$=":niet"][aria-pressed="true"] { background: var(--no); }
  .snel { display: flex; gap: 10px; align-items: center; margin-top: 12px; font-size: 15px; cursor: pointer; }
  .snel input { width: 18px; height: 18px; accent-color: var(--green); }

  /* Gezin */
  .count { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; }
  .count + .count { border-top: 1px solid var(--line); }
  .stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border-radius: 14px; padding: 4px; }
  .stepper button { width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--surface); font-size: 20px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .stepper button:disabled { opacity: .35; cursor: default; }
  .stepper span { min-width: 28px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .rulelist { display: grid; gap: 6px; }
  .rule { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 9px 12px; cursor: pointer; font-size: 15px; }
  .rmark { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--green-soft); color: var(--green); }
  .rstate { font-size: 12px; font-weight: 700; color: var(--green); }
  .rule.niet { border-color: var(--no); background: var(--no-bg); }
  .rule.niet .rmark { background: var(--no); color: var(--surface); }
  .rule.niet .rstate { color: var(--no); }
  .babycard input[type="text"], .babycard textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .gezinlink { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; background: none; border: 0; cursor: pointer; text-align: right; padding: 0; }

  /* Spaarkaarten */
  .cards { display: grid; gap: 12px; }
  .lcard {
    width: 100%; text-align: left; cursor: pointer; border: 1px solid var(--line); border-radius: 16px;
    background: var(--surface); padding: 18px 18px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px;
    box-shadow: var(--shadow); aspect-ratio: 1.9 / 1; max-height: 190px; align-content: space-between;
  }
  .lcard .cname { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.1; }
  .lcard .ctype { font-size: 13px; color: var(--muted); grid-column: 1; }
  .lcard .cnum { grid-column: 1 / -1; font-variant-numeric: tabular-nums; letter-spacing: .12em; font-size: 16px; }
  .lcard .copen { grid-row: 1; grid-column: 2; font-size: 13px; font-weight: 700; color: var(--green); align-self: start; }
  .lcard.s0 { border-top: 6px solid var(--green); }
  .lcard.s1 { border-top: 6px solid var(--tag); }
  .lcard.s2 { border-top: 6px solid var(--baby); }
  .lcard.s3 { border-top: 6px solid var(--warn); }
  .syncnote { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .syncnote .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
  .syncnote.local .dot { background: var(--warn); }

/* ---------- Prijzen en kosten ---------- */
// Richtprijzen (gewone supermarktprijs) per kilo, en het gewicht van één stuk in gram.
// Gebruikt als er geen actieprijs per kilo bekend is. Het zijn schattingen, geen winkelprijzen.
const EST = {
  broccoli: [3.6, 500], bloemkool: [2, 1000], wortel: [1.5, 100], pompoen: [1.7, 1200], courgette: [3, 300],
  'zoete-aardappel': [3, 300], aardappel: [1.4, 150], spinazie: [5], prei: [2.8, 250], paprika: [4.4, 180],
  tomaat: [4, 100], champignons: [5], sperziebonen: [5], doperwten: [3], 'rode-biet': [3, 150], pastinaak: [3, 250],
  ui: [1.5, 150], appel: [2.5, 180], peer: [2.5, 180], banaan: [1.8, 150], avocado: [5, 200], 'blauwe-bessen': [12],
  mango: [3.75, 400], aardbeien: [8], kipfilet: [11], kippendij: [10], kalkoen: [13], gehakt: [9], zalm: [22, 125],
  witvis: [15, 150], eieren: [5, 60], yoghurt: [1.8], feta: [12], kaas: [12], kikkererwten: [2.25], linzen: [3.5],
  bonen: [2.25], kokosmelk: [4], passata: [2], pindakaas: [7], pasta: [2.5], rijst: [2.5], wraps: [4, 62], brood: [3.2, 35],
  bloem: [1.1], spek: [12], stoofvlees: [13], room: [4], 'rode-kool': [1.5, 1000], komkommer: [3, 350],
};
// Kleine voorraadproducten zonder eigen folderproduct
const PANTRY = [
  [/melk/, { kg: 1.2 }], [/boter/, { kg: 9 }], [/olie/, { kg: 9 }], [/citroen/, { stuk: 0.45 }],
  [/knoflook/, { stuk: 0.1 }], [/bouillon/, { stuk: 0.15 }], [/currypasta/, { el: 0.35 }], [/ketjap/, { el: 0.1 }],
];
function gramsOf(k, q, u) {
  if (q == null) return null;
  if (u === 'g' || u === 'ml') return q;
  if (u === 'blik') return q * 400;
  if (u === 'el') return q * 15;
  if (u === 'tl') return q * 5;
  return q * ((EST[k] && EST[k][1]) || 100);
}
// Prijs per kilo voor product k: de goedkoopste actie in jouw winkels, anders de richtprijs
function priceInfo(k) {
  const est = EST[k] ? EST[k][0] : null;
  let bestKg = Infinity, bestO = null;
  for (const o of where(k)) {
    if (o.winkel === 'Voorbeeld') continue;
    let kg = o.perKg;
    if (kg == null && o.prijs != null && EST[k] && EST[k][1] && /stuk|los/i.test(o.eenheid || '')) kg = o.prijs / (EST[k][1] / 1000);
    if (kg != null && kg < bestKg) { bestKg = kg; bestO = o; }
  }
  // Een actieprijs die veel hoger is dan normaal hoort vrijwel zeker bij een ander soort product
  if (bestO && (est == null || bestKg < est * 1.5)) return { perKg: bestKg, actie: true, winkel: bestO.winkel };
  return est == null ? null : { perKg: est, actie: false };
}
// Kosten van een regel met al geschaalde hoeveelheid q
function costOf(k, n, q, u) {
  if (q == null) return null;
  if (k) {
    const pi = priceInfo(k); const g = gramsOf(k, q, u);
    return pi && g != null ? { eur: g / 1000 * pi.perKg, actie: pi.actie } : null;
  }
  const rule = PANTRY.find(([re]) => re.test(n));
  if (!rule) return null;
  const r = rule[1];
  if (r.kg) return { eur: gramsOf(null, q, u) / 1000 * r.kg, actie: false };
  if (r.el && u === 'el') return { eur: q * r.el, actie: false };
  if (r.stuk && !u) return { eur: q * r.stuk, actie: false };
  return null;
}
const scaledQ = i => i.q == null ? null : (i.baby ? i.q * babys().length : i.q * porties() / 2);
const lineCost = i => costOf(i.k, i.n, scaledQ(i), i.u);

// Alle ingrediënten van een recept, met de gekozen goedkopere alternatieven
function allIngr(r, active = swaps[r.id] || []) {
  const act = SWAPS.filter(w => active.includes(w.id));
  return r.ingr.filter(i => !i.baby || hasBaby())
    .map(i => i.n.includes('{baby}') ? { ...i, n: i.n.split('{baby}').join(babyNames()) } : i)
    .flatMap(i => { const w = act.find(x => x.from.includes(i.k)); return w ? w.apply(i) : [i]; });
}

const omitKey = (r, i) => r.id + '|' + i.n;
const isOmitted = (r, i) => weglaten.includes(omitKey(r, i));
const effIngr = (r, active) => allIngr(r, active).filter(i => !isOmitted(r, i));
function recipeCost(r, active) {
  let total = 0, actie = 0;
  effIngr(r, active).forEach(i => { const c = lineCost(i); if (c) { total += c.eur; if (c.actie) actie += c.eur; } });
  return { total, actie };
}
function swapOptions(r) {
  const cur = swaps[r.id] || [], base = recipeCost(r).total;
  return SWAPS.filter(w => r.ingr.some(i => w.from.includes(i.k))).map(w => {
    const on = cur.includes(w.id);
    const other = recipeCost(r, on ? cur.filter(x => x !== w.id) : [...cur, w.id]).total;
    return { w, on, saving: on ? other - base : base - other };
  }).filter(o => o.on || o.saving > 0.1).sort((a, b) => b.saving - a.saving);
}

/* ---------- Kookstand: één stap tegelijk, groot, scherm blijft aan, met kookwekkers ---------- */
let kook = null, kookLock = null, kookTik = null;
const kookEl = () => document.getElementById('kook');
// '20 minuten', '10 à 12 minuten', '1 uur' → wekkers (in minuten); bij een bereik de kortste tijd, om op tijd te controleren
function wekkersIn(t) {
  const uit = [], re = /(\d+(?:[.,]\d+)?)(?:\s*(?:à|a|tot|-|–|of)\s*(\d+(?:[.,]\d+)?))?\s*(minuten|minuut|min\b|uur|kwartier)/gi;
  let m;
  while ((m = re.exec(t))) {
    if (/^\s*(korter|langer|eerder|later|voor het einde|extra)/i.test(t.slice(m.index + m[0].length))) continue;   // 'twee minuten korter' is geen kooktijd
    const v = parseFloat(m[1].replace(',', '.')); const eenheid = m[3].toLowerCase();
    const min = eenheid === 'uur' ? v * 60 : eenheid === 'kwartier' ? v * 15 : v;
    if (min >= 1 && min <= 300 && !uit.includes(min)) uit.push(min);
  }
  if (/\bkwartier\b/i.test(t) && !/\d\s*kwartier/i.test(t) && !uit.includes(15)) uit.push(15);
  return uit;
}
const duurTekst = min => min >= 60 ? `${Math.floor(min / 60)} uur${min % 60 ? ' ' + (min % 60) + ' min' : ''}` : `${min} min`;
const klok = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
async function schermAan() { try { if ('wakeLock' in navigator && !kookLock) { kookLock = await navigator.wakeLock.request('screen'); kookLock.addEventListener('release', () => { kookLock = null; }); } } catch (e) {} }
function kookOpen(id) {
  const r = RMAP[id] || (window.eigenRecept && eigenRecept(id)); if (!r) return;
  const stappen = r.stappen.map(adultStep).filter(Boolean);
  kook = { r, stappen, stap: 0, wekkers: (kook && kook.wekkers) || [] };
  kookEl().hidden = false; document.body.classList.add('kookt');
  schermAan(); kookTeken();
  clearInterval(kookTik); kookTik = setInterval(kookTikken, 500);
}
function kookSluiten() {
  if (kook && kook.wekkers.some(w => !w.klaar) && !confirm('Er loopt nog een kookwekker. Toch stoppen?')) return;
  kook = null; kookEl().hidden = true; kookEl().innerHTML = ''; document.body.classList.remove('kookt');
  clearInterval(kookTik); if (kookLock) { kookLock.release().catch(() => {}); kookLock = null; }
}
function kookTeken() {
  const { r, stappen, stap } = kook, n = stappen.length;   // stap 0 = klaarzetten, laatste = smakelijk eten
  const ing = effIngr(r);
  const inhoud = stap === 0 ? `
      <div class="keyebrow">Eerst klaarzetten</div>
      <ul class="kingr">${ing.map(i => `<li>${artIcon(i.k, i.n, 30)}<span><b>${esc(i.n)}</b> ${esc(fmtQ(i))}</span></li>`).join('')}</ul>
      ${r.gerei ? `<div class="keyebrow" style="margin-top:18px">Pak erbij</div><p class="kgerei">${esc(r.gerei.join(', '))}</p>` : ''}`
    : stap > n ? `<div class="kklaar">${produceRow(['tomaat', 'broccoli', 'wortel'])}<p class="ktekst">Klaar! Eet smakelijk.</p></div>`
    : `<div class="keyebrow">Stap ${stap} van ${n}</div><p class="ktekst">${esc(stappen[stap - 1])}</p>
      ${wekkersIn(stappen[stap - 1]).map(min => `<button class="btn kwekknop" data-kwekker="${min}" data-klabel="${esc('Stap ' + stap)}">⏲ Wekker ${duurTekst(min)}</button>`).join('')}`;
  kookEl().innerHTML = `
    <div class="kkop">
      <button class="kstop" data-kstop aria-label="Kookstand sluiten">✕ Stoppen</button>
      <h2 id="kook-titel">${esc(r.naam)}</h2>
    </div>
    <div class="kvoortgang" aria-hidden="true"><span style="width:${Math.round(Math.min(stap, n + 1) / (n + 1) * 100)}%"></span></div>
    <div class="kwekkers" id="kwekkers"></div>
    <div class="kinhoud">${inhoud}</div>
    <div class="knav">
      <button class="btn" data-kvorige ${stap === 0 ? 'disabled' : ''}>‹ Vorige</button>
      ${stap > n ? '<button class="btn primary" data-kstop>Sluiten</button>' : `<button class="btn primary" data-kvolgende>${stap === 0 ? 'Beginnen' : stap === n ? 'Klaar' : 'Volgende ›'}</button>`}
    </div>`;
  kookTikken();
}
function kookTikken() {
  if (!kook) return;
  const box = document.getElementById('kwekkers'); if (!box) return;
  const nu = Date.now();
  kook.wekkers.forEach(w => { if (!w.klaar && nu >= w.eind) { w.klaar = true; kookAlarm(w); } });
  box.innerHTML = kook.wekkers.map(w => `<div class="kwek${w.klaar ? ' af' : ''}"><span>⏲ ${esc(w.label)}</span><b>${w.klaar ? 'Tijd is om!' : klok(w.eind - nu)}</b><button data-kwekweg="${w.id}" aria-label="Wekker weghalen">✕</button></div>`).join('');
}
function kookAlarm(w) {
  try { navigator.vibrate && navigator.vibrate([500, 250, 500, 250, 500]); } catch (e) {}
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .45, .9].forEach(t => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.0001, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.4, ctx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .35);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .4); });
  } catch (e) {}
  toast(`Wekker klaar: ${w.label}`);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-kook],[data-kstop],[data-kvorige],[data-kvolgende],[data-kwekker],[data-kwekweg]');
  if (!t) return;
  if (t.dataset.kook) { kookOpen(t.dataset.kook); return; }
  if (!kook) return;
  if (t.hasAttribute('data-kstop')) kookSluiten();
  else if (t.hasAttribute('data-kvorige')) { kook.stap = Math.max(0, kook.stap - 1); kookTeken(); }
  else if (t.hasAttribute('data-kvolgende')) { kook.stap = Math.min(kook.stappen.length + 1, kook.stap + 1); kookTeken(); }
  else if (t.dataset.kwekker) {
    const min = Number(t.dataset.kwekker);
    kook.wekkers.push({ id: Math.random().toString(36).slice(2, 8), label: `${t.dataset.klabel} · ${duurTekst(min)}`, eind: Date.now() + min * 60000, klaar: false });
    kookTikken(); toast(`Wekker gezet: ${duurTekst(min)}`);
  }
  else if (t.dataset.kwekweg) { kook.wekkers = kook.wekkers.filter(w => w.id !== t.dataset.kwekweg); kookTikken(); }
});
document.addEventListener('keydown', e => {
  if (!kook) return;

(() => {   // vegen naar links/rechts = volgende/vorige stap
  let x0 = null;
  document.addEventListener('touchstart', e => { x0 = kook ? e.touches[0].clientX : null; }, { passive: true });

  }, { passive: true });
})();

const HERINNERINGEN = [[0, 'Bij de start'], [15, '15 min eerder'], [30, '30 min eerder'], [60, '1 uur eerder']];
const minuten = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const hhmm = min => { min = Math.max(0, min); return `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`; };
const startTijd = r => hhmm(minuten(etenstijd) - r.tijd);
const dagDatum = i => { const d = new Date(monday); d.setDate(monday.getDate() + i); return d; };
function icsTekst(p) {
  const pad = n => String(n).padStart(2, '0');
  const dstr = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const tstr = min => `T${pad(Math.floor(min / 60))}${pad(min % 60)}00`;
  const esc_ = t => String(t).replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  // Regels langer dan 75 tekens worden volgens de agenda-standaard afgebroken
  const vouw = l => { const out = []; while (l.length > 73) { out.push(l.slice(0, 73)); l = ' ' + l.slice(73); } out.push(l); return out.join('\r\n'); };
  const nu = new Date(), stamp = `${dstr(nu)}T${pad(nu.getHours())}${pad(nu.getMinutes())}00`;
  const link = location.protocol === 'https:' ? location.origin + location.pathname : 'https://sachasteenhorst.github.io/sacha/recepten-app/';
  const eind = minuten(etenstijd), nuMin = nu.getHours() * 60 + nu.getMinutes();
  const events = p.map((r, i) => ({ r, i })).filter(({ i }) => i > dayIdx || (i === dayIdx && nuMin < eind)).map(({ r, i }) => {
    const d = dstr(dagDatum(i)), start = Math.max(0, eind - r.tijd);
    return ['BEGIN:VEVENT', `UID:aanbiedingskeuken-${d}@sachasteenhorst.github.io`, `DTSTAMP:${stamp}`,
      `DTSTART:${d}${tstr(start)}`, `DTEND:${d}${tstr(eind)}`,
      `SUMMARY:${esc_('Koken: ' + r.naam)}`,
      `DESCRIPTION:${esc_(`Begin om ${hhmm(start)}, dan eten jullie om ${etenstijd}.\nKooktijd ${r.tijd} minuten, voor ${gezinLabel()}.\nRecept en boodschappen: ${link}`)}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${esc_(`Tijd om te koken: ${r.naam}`)}`, `TRIGGER:-PT${herinnering}M`, 'END:VALARM',
      'END:VEVENT'];
  });
  return { aantal: events.length, tekst: ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Aanbiedingskeuken//Weekmenu//NL', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    ...events.flat(), 'END:VCALENDAR'].map(vouw).join('\r\n') + '\r\n' };
}

function ago(ts) {
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return 'zojuist'; if (m < 60) return `${m} min geleden`;
  const u = Math.round(m / 60); if (u < 24) return `${u} uur geleden`;
  const d = Math.round(u / 24); return d === 1 ? 'gisteren' : d < 7 ? `${d} dagen geleden` : new Date(ts).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' });
}
// Foto verkleinen tot max. 1200 px en als JPEG versturen (onder 1 MB)
function verklein(file) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const f = Math.min(1, 1200 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * f); c.height = Math.round(img.height * f);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('foto')), 'image/jpeg', .8);
    };
    img.onerror = () => rej(new Error('foto')); img.src = url;
  });
}
// Een ingrediëntregel zoals '400 g pompoen' of '2 el olie' omzetten naar de vorm van de eigen recepten
function leesRegel(t) {
  t = String(t).trim();
  const m = t.match(/^(\d+(?:[.,]\d+)?|½|¼|¾)\s*(kg|kilo|gram|gr|g|liter|l|ml|eetlepels?|el|theelepels?|tl|blikken|blikje|blik|stuks?|teentjes?|tenen|teen)?\.?\s+(.+)$/i);
  if (!m) return I(null, '', t, detectKey(t));
  let q = { '½': .5, '¼': .25, '¾': .75 }[m[1]] || parseFloat(m[1].replace(',', '.')), u = (m[2] || '').toLowerCase(), n = m[3].trim();
  if (/^(kg|kilo)$/.test(u)) { q *= 1000; u = 'g'; }
  else if (/^(gram|gr|g)$/.test(u)) u = 'g';
  else if (/^(liter|l)$/.test(u)) { q *= 1000; u = 'ml'; }
  else if (/^(eetlepels?|el)$/.test(u)) u = 'el';
  else if (/^(theelepels?|tl)$/.test(u)) u = 'tl';
  else if (/^blik/.test(u)) u = 'blik';
  else if (/^stuks?$/.test(u)) u = '';
  else if (/^(teen|tenen|teentjes?)$/.test(u)) { n = n + ' (teentjes)'; u = ''; }
  return I(q, u, n, detectKey(n));
}
const PERSONEN_TIJDLIJN = 4;   // gedeelde recepten vermelden geen aantal personen; we gaan uit van 4 (de eigen recepten zijn voor 2)
function postNaarRecept(p) {
  const ingr = p.ingredienten.map(leesRegel).map(i => i.q == null ? i : { ...i, q: i.q * 2 / PERSONEN_TIJDLIJN });

  return {
    id: 'tl-' + p.id, eigen: true, auteur: p.auteur, naam: p.titel, tijd: p.tijd || 30, soort,
    foto: p.foto_pad ? { src: fotoUrl(p.foto_pad), auteur: p.auteur, licentie: '', bron: '', licurl: '', soort: 'gerecht' } : null,

/* ---------- Gedeelde boodschappenlijst (Supabase) ---------- */
// Elk product is een eigen rij, zodat twee mensen tegelijk kunnen afvinken zonder elkaars werk te overschrijven.
// Weghalen = markeren met 'weg'; zulke rijen worden na een week echt opgeruimd.
let gedeeld = store.get('gedeeld', null);                 // { id, code }
let gSynced = store.get('gedeeldSynced', {});             // id -> laatst bekende JSON op de server
let gedeeldStatus = gedeeld ? 'laden' : 'uit';            // uit | laden | live | fout
let gedeeldFout = '', gTimer = null, gKanaal = null, gWachtCode = '';
const kanDelen = () => !inClaude && !!SUPA.url;
const codeTekst = c => c ? c.slice(0, 4) + '-' + c.slice(4) : '';
const bewaarSynced = () => store.set('gedeeldSynced', gSynced);
const lijstHertekenen = () => { if (tab === 'lijst' && !typing() && !lEdit) render(); };
function gedeeldFoutTekst(e) {
  const m = String((e && (e.message || e.code)) || e);
  if (/42P01|PGRST20[25]|does not exist|Could not find/i.test(m)) return 'De gedeelde lijst is nog niet ingesteld in Supabase (supabase/gedeelde-lijst.sql).';
  if (/onbekende code/i.test(m)) return 'Deze code kennen we niet. Controleer de 8 tekens.';
  return 'Geen verbinding. Je wijzigingen worden verstuurd zodra je weer online bent.';
}
async function gedeeldLaden() {
  if (!gedeeld || !kanDelen()) return;
  try {
    await sbInit();
    const { data, error } = await sb.from('lijst_items').select('id,data,updated_at').eq('lijst_id', gedeeld.id);
    if (error) throw error;
    const remote = new Set(data.map(r => r.id));
    const lokaalNieuw = lijst.filter(i => !remote.has(i.id) && !(i.id in gSynced));   // offline toegevoegd
    gSynced = {};
    const volgorde = new Map(lijst.map((i, n) => [i.id, n]));
    const opServer = data.filter(r => !r.data.weg).map(r => r.data).sort((a, b) => (volgorde.get(a.id) ?? 1e9) - (volgorde.get(b.id) ?? 1e9));
    data.forEach(r => { gSynced[r.id] = JSON.stringify(r.data); });
    lijst = [...opServer, ...lokaalNieuw];
    store.set('boodschappen', lijst); bewaarSynced();
    gedeeldStatus = 'live'; gedeeldFout = '';
    if (lokaalNieuw.length) gedeeldSync();
    const oud = data.filter(r => r.data.weg && Date.now() - new Date(r.updated_at) > 7 * 864e5).map(r => r.id);
    if (oud.length) sb.from('lijst_items').delete().eq('lijst_id', gedeeld.id).in('id', oud).then(() => {}, () => {});
    gedeeldLuister();
  } catch (e) { gedeeldStatus = 'fout'; gedeeldFout = gedeeldFoutTekst(e); }
  lijstHertekenen();
}
function gedeeldSync() {
  if (!gedeeld || !kanDelen()) return;
  clearTimeout(gTimer);
  gTimer = setTimeout(async () => {
    const nu = new Map(lijst.map(i => [i.id, i])), stamp = new Date().toISOString(), rows = [];
    nu.forEach((i, id) => { if (gSynced[id] !== JSON.stringify(i)) rows.push({ lijst_id: gedeeld.id, id, data: i, updated_at: stamp }); });
    Object.keys(gSynced).forEach(id => { if (!nu.has(id) && !JSON.parse(gSynced[id]).weg) rows.push({ lijst_id: gedeeld.id, id, data: { id, weg: true }, updated_at: stamp }); });
    if (!rows.length) return;
    try {
      await sbInit();
      const { error } = await sb.from('lijst_items').upsert(rows);
      if (error) throw error;
      rows.forEach(r => { gSynced[r.id] = JSON.stringify(r.data); }); bewaarSynced();
      if (gedeeldStatus !== 'live') { gedeeldStatus = 'live'; gedeeldFout = ''; lijstHertekenen(); }
    } catch (e) { gedeeldStatus = 'fout'; gedeeldFout = gedeeldFoutTekst(e); lijstHertekenen(); }
  }, 350);
}
function gedeeldLuister() {
  if (gKanaal || !sb || !gedeeld) return;
  gKanaal = sb.channel('lijst-' + gedeeld.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'lijst_items', filter: `lijst_id=eq.${gedeeld.id}` }, p => {
      const r = p.new; if (!r || !r.id || !r.data) return;
      const j = JSON.stringify(r.data); if (gSynced[r.id] === j) return;   // onze eigen wijziging
      gSynced[r.id] = j; bewaarSynced();
      const n = lijst.findIndex(i => i.id === r.id);
      if (r.data.weg) { if (n >= 0) lijst.splice(n, 1); }
      else if (n >= 0) lijst[n] = r.data; else lijst.push(r.data);
      store.set('boodschappen', lijst); lijstHertekenen();
    })
    .subscribe();
}
function gedeeldStoppenLuisteren() { if (gKanaal && sb) sb.removeChannel(gKanaal); gKanaal = null; }
async function gedeeldMaken() {
  try {
    await sbInit();
    const { data, error } = await sb.rpc('lijst_maken');
    if (error) throw error;
    const r = Array.isArray(data) ? data[0] : data;
    gedeeld = { id: r.lijst_id, code: r.lijst_code }; store.set('gedeeld', gedeeld);
    gSynced = {}; bewaarSynced(); gedeeldStatus = 'live'; gedeeldFout = '';
    gedeeldSync(); gedeeldLuister(); render();
    toast('Je lijst is nu gedeeld. Tik op Uitnodigen om de code te sturen.');
  } catch (e) { gedeeldFout = gedeeldFoutTekst(e); render(); }
}
async function gedeeldMeedoen(code) {
  const c = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length !== 8) { gedeeldFout = 'Een code bestaat uit 8 tekens, bijvoorbeeld ABCD-EF23.'; render(); return; }
  try {
    await sbInit();
    const { data, error } = await sb.rpc('lijst_deelnemen', { p_code: c });
    if (error) throw error;
    gedeeldStoppenLuisteren();
    gedeeld = { id: data, code: c }; store.set('gedeeld', gedeeld);
    gSynced = {}; bewaarSynced(); gedeeldStatus = 'laden'; gedeeldFout = ''; gWachtCode = '';
    render(); await gedeeldLaden();
    toast('Je doet mee met de gedeelde lijst.');
  } catch (e) { gedeeldFout = gedeeldFoutTekst(e); render(); }
}
async function gedeeldStoppen() {
  const oud = gedeeld; gedeeldStoppenLuisteren();
  gedeeld = null; store.set('gedeeld', null); gSynced = {}; bewaarSynced(); gedeeldStatus = 'uit'; gedeeldFout = '';
  render();
  try { await sbInit(); await sb.from('lijst_leden').delete().eq('lijst_id', oud.id).eq('user_id', sbUid); } catch (e) {}
  toast('Je deelt deze lijst niet meer. Je houdt een eigen kopie.');
}

  const link = (location.protocol === 'https:' ? location.origin + location.pathname : 'https://sachasteenhorst.github.io/sacha/recepten-app/') + '?lijst=' + gedeeld.code;
  const tekst = `Doe mee met onze boodschappenlijst in de Aanbiedingskeuken. Open de link, of vul bij Boodschappen de code ${codeTekst(gedeeld.code)} in.`;

function eanOk(d) {
  if (!/^\d{8}$|^\d{13}$/.test(d)) return false;
  const n = d.split('').map(Number), c = n.pop();
  const sum = n.reverse().reduce((s, x, i) => s + x * (i % 2 ? 1 : 3), 0);
  return (10 - sum % 10) % 10 === c;
}

  document.getElementById('splash-sub').textContent = n ? `${n} van de 7 gerechten met producten uit de aanbieding` : 'Zeven gezonde gerechten voor je klaargezet';
  let klaar = false;
  const sluit = () => { if (klaar) return; klaar = true; sp.classList.add('weg'); setTimeout(() => sp.remove(), 450); };
  sp.addEventListener('click', sluit);
  setTimeout(sluit, 4000);   // 4 seconden in beeld; tikken sluit het eerder
})();

/* Als geïnstalleerde app (buiten claude.ai): offline-laag registreren */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !(window.claude && window.claude.use)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // Nieuwe versie actief? Dan één keer herladen, zodat je meteen de nieuwste app ziet.
  if (navigator.serviceWorker.controller) {
    let herladen = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!herladen) { herladen = true; location.reload(); } });
  }
}

/* Folders laden: eerst uit de gedeelde opslag van de app, anders uit aanbiedingen.json ernaast */
function setLive(d) {
  if (!d || !d.winkels) return;
  live = d; store.set('live', d);
  const ta = document.getElementById('plak');
  if (!(ta && ta.value)) { const open = !!document.querySelector('details.manual[open]'); render(); if (open) openManual(); }
}
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use('db').catch(() => null) : null;
  if (db) {
    db.doc('folders/actueel').onSnapshot(snap => { if (snap.exists) setLive(snap.data()); }, () => {});
    connectCards(db);
    return;
  }
  try { const r = await fetch('aanbiedingen.json', { cache: 'no-store' }); if (r.ok) setLive(await r.json()); } catch (e) {}
})();

/* Privédeel van de opslag (data/users/<jouw id>): spaarkaarten en boodschappenlijst, op elk apparaat gelijk */
function persistList() {
  store.set('boodschappen', lijst);
  if (gedeeld) gedeeldSync();
  if (saveList) saveList(lijst).catch(() => { lijstSync = 'lokaal'; render(); });
}
const typing = () => { const a = document.activeElement; return a && app.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'checkbox'; };
function bindPrivate(db, uid, cfg) {
  const ref = db.doc(`data/users/${uid}/${cfg.doc}`);
  const save = list => ref.set({ lijst: list });
  ref.onSnapshot(snap => {
    const remote = snap.exists && Array.isArray((snap.data() || {}).lijst) ? snap.data().lijst : null;
    if (!store.get(cfg.flag, false)) {
      // Allereerste koppeling op dit apparaat: wat alleen lokaal stond meenemen naar je account.
      // Daarna is je account leidend, zodat iets dat op een ander apparaat is verwijderd niet terugkomt.
      const merged = [...(remote || [])];
      cfg.get().forEach(c => { if (!merged.some(m => cfg.same(m, c))) merged.push(c); });
      if (merged.length && (!remote || merged.length !== remote.length)) save(merged).catch(() => {});
      cfg.set(merged);
      store.set(cfg.flag, true);
    } else if (remote) {
      cfg.set(remote);
    }
    cfg.synced(true);
    if ((cfg.tab === '*' || tab === cfg.tab) && document.getElementById('scan').hidden && !typing()) render();
  }, () => { cfg.synced(false); if (tab === cfg.tab) render(); });
  return save;
}
async function connectCards(db) {
  const user = await window.claude.use('user').catch(() => null);
  const uid = user ? await user.id() : null;
  if (!uid) return; // geen account in deze weergave: alles blijft op dit apparaat
  saveCards = bindPrivate(db, uid, {
    doc: 'kaarten', flag: 'kaartenAccount', tab: 'kaarten', same: (a, b) => a.nummer === b.nummer,
    get: () => kaarten, set: v => { kaarten = v; store.set('kaarten', v); }, synced: ok => { kaartenSync = ok ? 'account' : 'lokaal'; },
  });
  saveList = bindPrivate(db, uid, {
    doc: 'boodschappen', flag: 'lijstAccount', tab: 'lijst', same: (a, b) => a.id === b.id,
    get: () => lijst, set: v => { lijst = v; store.set('boodschappen', v); }, synced: ok => { lijstSync = ok ? 'account' : 'lokaal'; },
  });
  const pref = (doc, key, get, set) => bindPrivate(db, uid, {
    doc, flag: key + 'Account', tab: '*', same: (a, b) => a === b, get, set: v => { set(v); store.set(key, v); }, synced: () => {},
  });
  saveGezin = bindPrivate(db, uid, {
    doc: 'gezin', flag: 'gezinAccount', tab: '*', same: () => true,
    get: () => [gezin], set: v => { if (v[0] && typeof v[0].volw === 'number') { gezin = v[0]; store.set('gezin', gezin); } }, synced: () => {},
  });
  saveFav = pref('favorieten', 'favorieten', () => favorieten, v => { favorieten = v; });
  saveAll = pref('allergieen', 'allergieen', () => allergieen, v => { allergieen = v; });
  saveVk = pref('voorkeuren', 'voorkeuren', () => voorkeuren, v => { voorkeuren = v; });
  saveWeg = pref('weglaten', 'weglaten', () => weglaten, v => { weglaten = v; });
}
